<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Calculateria</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/login.css">
    <link rel="shortcut icon" href="../img/favicon.png" type="image/x-icon">
</head>
<body>
<div class="tela">
    <aside class="lado tablete" aria-hidden="true"><img src="../img/favicon.png" alt=""></aside>
    <div class="login-box">
        <h1 id="titulo">Entrar</h1>
        <p id="subtitulo">Entre com seu e-mail e senha.</p>

        <div class="abas" role="tablist">
            <button type="button" class="aba ativa" id="aba-entrar" role="tab">Entrar</button>
            <button type="button" class="aba" id="aba-criar" role="tab">Criar conta</button>
        </div>

        <form id="form-login" novalidate>
            <div class="input-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" placeholder="seu@email.com" autocomplete="username" required>
            </div>
            <div class="input-group">
                <label for="senha">Senha</label>
                <div class="campo-senha">
                    <input type="password" id="senha" placeholder="••••••" autocomplete="current-password" required>
                    <button type="button" class="ver" id="ver" aria-label="Mostrar senha">Mostrar</button>
                </div>
                <small class="dica" id="dica" hidden>Mínimo de 6 caracteres.</small>
            </div>
            <div id="msg-erro" class="msg-erro" role="alert"></div>
            <button type="submit" class="btn-entrar" id="btn-entrar">Entrar</button>
        </form>

        <button type="button" class="btn-demo" id="btn-demo">Entrar sem cadastro (demonstração)</button>

        <a href="../index.html" class="voltar">← Voltar</a>
    </div>
</div>

<script>
    const form = document.getElementById('form-login');
    const msg  = document.getElementById('msg-erro');
    const btn  = document.getElementById('btn-entrar');
    const senhaInput = document.getElementById('senha');
    let modo = 'entrar';   // 'entrar' ou 'criar'

    // Se já está logado, vai direto para o painel
    fetch('/api/me').then(r => r.json()).then(d => {
        if (d.logado) window.location.href = '/pages/main.html';
    }).catch(() => {});

    function trocarModo(novo) {
        modo = novo;
        const criar = modo === 'criar';
        document.getElementById('aba-entrar').classList.toggle('ativa', !criar);
        document.getElementById('aba-criar').classList.toggle('ativa', criar);
        document.getElementById('titulo').textContent = criar ? 'Criar conta' : 'Entrar';
        document.getElementById('subtitulo').textContent = criar
            ? 'Cadastre-se em segundos e já comece a usar.'
            : 'Entre com seu e-mail e senha.';
        btn.textContent = criar ? 'Criar conta' : 'Entrar';
        senhaInput.autocomplete = criar ? 'new-password' : 'current-password';
        document.getElementById('dica').hidden = !criar;
        msg.textContent = '';
    }
    document.getElementById('aba-entrar').onclick = () => trocarModo('entrar');
    document.getElementById('aba-criar').onclick  = () => trocarModo('criar');

    document.getElementById('ver').onclick = (e) => {
        const mostrando = senhaInput.type === 'text';
        senhaInput.type = mostrando ? 'password' : 'text';
        e.target.textContent = mostrando ? 'Mostrar' : 'Ocultar';
    };

    async function enviar(url, corpo, textoBotao, botao) {
        msg.textContent = '';
        botao.disabled = true;
        botao.textContent = 'Aguarde...';
        try {
            const res  = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(corpo || {}),
            });
            const data = await res.json();
            if (data.sucesso) { window.location.href = '/pages/main.html'; return; }
            msg.textContent = data.erro || 'Não foi possível entrar.';
        } catch {
            msg.textContent = 'Não foi possível conectar ao servidor. Tente novamente em instantes.';
        }
        botao.disabled = false;
        botao.textContent = textoBotao;
    }

    form.addEventListener('submit', (e) => {
        e.preventDefault();
        const email = document.getElementById('email').value.trim();
        const senha = senhaInput.value;
        if (!email || !senha) { msg.textContent = 'Preencha o e-mail e a senha.'; return; }
        enviar(modo === 'criar' ? '/api/cadastro' : '/api/login', { email, senha },
               modo === 'criar' ? 'Criar conta' : 'Entrar', btn);
    });

    const btnDemo = document.getElementById('btn-demo');
    btnDemo.addEventListener('click', () =>
        enviar('/api/demo', null, 'Entrar sem cadastro (demonstração)', btnDemo));
</script>
</body>
</html>
