<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculateria — Painel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/main.css">
  <link rel="shortcut icon" href="../img/favicon.png" type="image/x-icon">
</head>
<body>

<header>
  <h1>Calculateria</h1>
  <div class="header-links">
    <a href="calculadora.html">Calculadora de preços →</a>
    <a href="#" onclick="sair(); return false;">Sair</a>
  </div>
</header>

<main>

  <!-- Resumo -->
  <div class="resumo">
    <div class="resumo-item">
      <div class="label">Vendas</div>
      <div class="valor" id="totalVendas">R$ 0,00</div>
    </div>
    <div class="resumo-item">
      <div class="label">Gastos</div>
      <div class="valor" id="totalGastos">R$ 0,00</div>
    </div>
    <div class="resumo-item lucro">
      <div class="label">Lucro</div>
      <div class="valor" id="lucro">R$ 0,00</div>
    </div>
  </div>

  <!-- Inputs -->
  <div class="card">
    <h2>Adicionar Venda</h2>
    <div class="row">
      <input type="number" id="valorVenda" placeholder="R$" min="0.01" step="0.01">
      <button class="btn-venda" onclick="adicionar('venda')">+ Venda</button>
    </div>
    <div id="msg-venda" class="msg"></div>
  </div>

  <div class="card">
    <h2>Adicionar Gasto</h2>
    <div class="row">
      <input type="number" id="valorGasto" placeholder="R$" min="0.01" step="0.01">
      <button class="btn-gasto" onclick="adicionar('gasto')">− Gasto</button>
    </div>
    <div id="msg-gasto" class="msg"></div>
  </div>

  <!-- Histórico -->
  <div>
    <div class="hist-header">
      <h2>Histórico</h2>
      <button class="btn-clear" onclick="limpar()">Limpar tudo</button>
    </div>
    <ul id="lista"></ul>
  </div>

</main>

<script>
  function fmt(n) {
    return 'R$ ' + Number(n).toFixed(2).replace('.', ',');
  }

  function fmtData(s) {
    // "2026-10-08 14:30:00" -> "08/10 14:30"
    if (!s) return '—';
    const [d, h] = s.split(' ');
    const [, m, dia] = d.split('-');
    return `${dia}/${m} ${h.slice(0, 5)}`;
  }

  function showMsg(id, texto, ok) {
    const el = document.getElementById(id);
    el.textContent = texto;
    el.style.color = ok ? '#1d6640' : '#991b1b';
    clearTimeout(el._t);
    el._t = setTimeout(() => el.textContent = '', 3000);
  }

  async function carregarResumo() {
    try {
      const res  = await fetch('/api/resumo');
      if (res.status === 401) { window.location.href = '/pages/login.html'; return; }
      const data = await res.json();
      renderResumo(data.total_vendas, data.total_gastos, data.lucro);
      renderHistorico(data.historico);
    } catch {
      document.getElementById('lista').innerHTML =
        '<li class="empty">Não foi possível conectar ao servidor.</li>';
    }
  }

  function renderResumo(tv, tg, lucro) {
    document.getElementById('totalVendas').textContent = fmt(tv);
    document.getElementById('totalGastos').textContent = fmt(tg);
    const el = document.getElementById('lucro');
    el.textContent = fmt(lucro);
    el.className   = 'valor ' + (lucro > 0 ? 'pos' : lucro < 0 ? 'neg' : '');
  }

  function renderHistorico(historico) {
    const lista = document.getElementById('lista');
    if (!historico || historico.length === 0) {
      lista.innerHTML = '<li class="empty">Nenhum registro ainda. Adicione a primeira venda ao lado.</li>';
      return;
    }
    lista.innerHTML = [...historico].reverse().map((r) => {
      const isVenda = r.tipo === 'Venda';
      return `<li>
        <span class="pill ${isVenda ? 'venda' : 'gasto'}"></span>
        <span class="li-desc">${r.tipo}</span>
        <span class="li-hora">${fmtData(r.criado_em)}</span>
        <span class="li-val ${isVenda ? 'venda' : 'gasto'}">${isVenda ? '+' : '−'} ${fmt(r.valor)}</span>
        <button class="del" title="Remover" onclick="remover(${r.id})">×</button>
      </li>`;
    }).join('');
  }

  async function adicionar(tipo) {
    const inputId = tipo === 'venda' ? 'valorVenda' : 'valorGasto';
    const msgId   = tipo === 'venda' ? 'msg-venda'  : 'msg-gasto';
    const val     = parseFloat(document.getElementById(inputId).value);

    if (!val || val <= 0) {
      document.getElementById(inputId).focus();
      showMsg(msgId, 'Digite um valor maior que zero.', false);
      return;
    }

    try {
      const res  = await fetch(tipo === 'venda' ? '/api/venda' : '/api/gasto', {
        method:  'POST',
        headers: { 'Content-Type': 'application/json' },
        body:    JSON.stringify({ valor: val }),
      });
      const data = await res.json();
      if (!data.sucesso) { showMsg(msgId, data.erro, false); return; }
      document.getElementById(inputId).value = '';
      showMsg(msgId, tipo === 'venda' ? 'Venda adicionada!' : 'Gasto registrado!', true);
      await carregarResumo();
    } catch {
      showMsg(msgId, 'Erro ao conectar com o servidor.', false);
    }
  }

  async function sair() {
    try { await fetch('/api/logout', { method: 'POST' }); } catch {}
    window.location.href = '/pages/login.html';
  }

  async function remover(id) {
    try {
      await fetch('/api/transacao/' + id, { method: 'DELETE' });
      await carregarResumo();
    } catch {
      alert('Erro ao conectar com o servidor.');
    }
  }

  async function limpar() {
    if (!confirm('Limpar todos os registros?')) return;
    try {
      await fetch('/api/resetar', { method: 'POST' });
      await carregarResumo();
    } catch {
      alert('Erro ao conectar com o servidor.');
    }
  }

  document.addEventListener('keydown', (e) => {
    if (e.key !== 'Enter') return;
    if (document.activeElement.id === 'valorVenda') adicionar('venda');
    if (document.activeElement.id === 'valorGasto') adicionar('gasto');
  });

  carregarResumo();
</script>
</body>
</html>
